# Значения переменных окружения для тестов.
#
# В application.yml у учётных данных нет значений по умолчанию, а плейсхолдеры обязаны
# разрешаться ещё до того, как поднимутся контейнеры. Настоящие адреса и пароли подставляет
# @ServiceConnection (см. TestcontainersConfiguration) и перекрывает значения ниже.
NOTIFICATION_DB_USER=test
NOTIFICATION_DB_PASSWORD=test

# Ключ подписи токенов. Тест выпускает токены этим же ключом — как это делает монолит.
JWT_SECRET=test-only-jwt-secret-not-used-outside-tests
